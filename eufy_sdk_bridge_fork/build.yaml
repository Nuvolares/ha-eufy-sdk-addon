# https://developers.home-assistant.io/docs/add-ons/configuration#add-on-buildyaml
#
# [fork] Built locally by the Supervisor (config.yaml has no `image:`). BRIDGE_REF pins the bridge commit;
# change it, bump the add-on version, and the Supervisor rebuilds on update.
build_from:
  aarch64: node:24-alpine
  amd64: node:24-alpine
args:
  BRIDGE_REPO: Nuvolares/ha-eufy-sdk-bridge
  BRIDGE_REF: c62eacfc0d39b7344872e6b955cbc4639783c6d4
  SDK_DIST_TAG: 0.6.0-beta.72
labels:
  org.opencontainers.image.source: "https://github.com/Nuvolares/ha-eufy-sdk-addon"
