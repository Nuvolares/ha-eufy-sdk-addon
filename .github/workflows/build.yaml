# [fork] Build the add-on image the way a Supervisor might (amd64) and smoke-test it.
name: Build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Pins in build.yaml match the Dockerfile defaults
        run: |
          set -e
          cd eufy_sdk_bridge_fork
          for k in BRIDGE_REPO BRIDGE_REF SDK_DIST_TAG; do
            y=$(sed -n "s/^  $k: //p" build.yaml)
            d=$(sed -n "s/^ARG $k=//p" Dockerfile)
            echo "$k build.yaml=$y Dockerfile=$d"
            test -n "$y" && test "$y" = "$d"
          done
      - name: Build image (no build args, like a Supervisor that ignores build.yaml)
        run: docker build -t addon-test eufy_sdk_bridge_fork
      - name: Build image (Supervisor passing its own HA base image)
        run: |
          docker build -t addon-test-ha \
            --build-arg BUILD_FROM=ghcr.io/home-assistant/amd64-base:latest \
            --build-arg BUILD_ARCH=amd64 \
            eufy_sdk_bridge_fork
      - name: Smoke test
        run: |
          set -e
          for img in addon-test addon-test-ha; do
          echo "== $img"
          docker run --rm --entrypoint sh "$img" -c '
            set -e
            go2rtc -version
            ffmpeg -hide_banner -encoders | grep -q libx264 && echo "ffmpeg has libx264"
            node -e "console.log(\"SDK\", require(\"/app/node_modules/@mega-yfue/eufy-sdk/package.json\").version)"
            grep -q __FORK_NVR_EXTRA_MEDIA_MODELS /app/node_modules/@mega-yfue/eufy-sdk/dist/index.js && echo "NVR patch applied"
            grep -q __FORK_NVR_DUAL_LENS_MODELS /app/node_modules/@mega-yfue/eufy-sdk/dist/index.js && echo "NVR dual-lens patch applied"
            cd /app && for f in server.mjs go2rtc-config.mjs src/*.mjs; do node --check "$f"; done && echo "bridge modules parse"
            node -e "import(\"/app/go2rtc-config.mjs\").then(m => console.log(m.h264Twin(\"CAM\", \"http://127.0.0.1:3000/stream/CAM\").join(\"\n\")))"
            test -x /usr/local/bin/eufy-sdk-bridge && test -x /run.sh && echo "entrypoints present"
          '
          done
